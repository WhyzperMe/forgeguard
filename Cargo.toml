[workspace]
resolver = "2"
members = [
    "crates/forgeguard-core",
    "crates/forgeguard-scanner",
    "crates/forgeguard-cargo",
    "crates/forgeguard-npm",
    "crates/forgeguard-osv",
    "crates/forgeguard-policy",
    "crates/forgeguard-report",
    "crates/forgeguard-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Whyzper.Me"]
repository = "https://github.com/whyzper/forgeguard"
homepage = "https://github.com/whyzper/forgeguard"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0.103"
cargo-lock = "11.0.1"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
httpmock = "0.8.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
urlencoding = "2.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
